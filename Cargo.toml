[package]
name = "rdp-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A single-binary MCP server for headless RDP control"
license = "Apache-2.0"
repository = "https://github.com/advenimus/conduit-desktop"

[lib]
name = "rdp_mcp"
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
jpeg-encoder = "0.6"
png = "0.18"
rmcp = { version = "3.1.4", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = [
    "io-std",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7"
uuid = { version = "1.6", default-features = false, features = ["v4"] }

[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
